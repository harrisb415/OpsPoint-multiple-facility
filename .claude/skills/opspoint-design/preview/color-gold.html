<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--card-bg); padding: 22px; color: var(--ink-900); }
  .row { display: flex; gap: 0; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-card); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 9px; }
  .sw .n { font-size: 11px; font-weight: 700; font-family: var(--font-mono); }
  .sw .v { font-size: 10px; font-family: var(--font-mono); opacity: .82; }
  .cap { margin-top: 12px; display: flex; align-items: baseline; gap: 10px; }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--gold-700);color:#fff8e6"><div class="n">700</div><div class="v">#a85d08</div></div>
    <div class="sw" style="background:var(--gold-600);color:#fff8e6"><div class="n">600</div><div class="v">#c9780c</div></div>
    <div class="sw" style="background:var(--gold-500);color:#3a2403"><div class="n">500</div><div class="v">#e8920f</div></div>
    <div class="sw" style="background:var(--gold-400);color:#3a2403"><div class="n">400</div><div class="v">#f7ad2e</div></div>
    <div class="sw" style="background:var(--gold-300);color:#5a3a05"><div class="n">300</div><div class="v">#fcc858</div></div>
    <div class="sw" style="background:var(--gold-200);color:#7a5208"><div class="n">200</div><div class="v">#fde08f</div></div>
    <div class="sw" style="background:var(--gold-100);color:#8a5a08"><div class="n">100</div><div class="v">#fdeec4</div></div>
    <div class="sw" style="background:var(--gold-50);color:#8a5a08"><div class="n">50</div><div class="v">#fff8e6</div></div>
  </div>
  <div class="cap"><b>Accent · Gold</b><span>The "door light" from the app icon — hero accent for actions, active states &amp; focus. 600 carries white text; 500 glows.</span></div>
</body>
</html>
