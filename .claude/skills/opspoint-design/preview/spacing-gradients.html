<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--card-bg); padding: 22px 24px; color: var(--ink-900); }
  .row { display: flex; gap: 12px; }
  .g { flex: 1; height: 76px; border-radius: var(--r-md); display: flex; align-items: flex-end; padding: 9px 10px; color: #fff; font-size: 11px; font-weight: 700; box-shadow: var(--shadow-card); }
  .cap { margin-top: 14px; display: flex; align-items: baseline; gap: 10px; }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="row">
    <div class="g" style="background:var(--grad-sidebar)">sidebar</div>
    <div class="g" style="background:var(--grad-census)">census hi</div>
    <div class="g" style="background:var(--grad-gold);color:#3a2403">gold CTA</div>
    <div class="g" style="background:var(--grad-page);color:var(--ink-500);box-shadow:inset 0 0 0 1px var(--line)">page wash</div>
  </div>
  <div class="cap"><b>Gradients · the depth layer</b><span>What turns flat slabs into depth. Sidebar &amp; highlighted stat cards fade teal→navy; CTAs glow gold; the page gets a subtle top-down wash.</span></div>
</body>
</html>
