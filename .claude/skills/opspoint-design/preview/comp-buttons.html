<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/opspoint/opspoint.css">
<style>
  body { background: #fff; padding: 22px 24px; }
  .grp { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cap { margin-top: 6px; display: flex; align-items: baseline; gap: 10px; }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="grp">
    <button class="btn btn-primary">+ New Report</button>
    <button class="btn btn-teal">Open Report</button>
    <button class="btn btn-secondary">Cancel</button>
    <button class="btn btn-danger">Close Shift</button>
    <button class="btn btn-primary" disabled>Saving…</button>
  </div>
  <div class="grp">
    <button class="btn btn-primary btn-sm">+ Add</button>
    <button class="btn btn-secondary btn-sm">Print</button>
    <button class="btn-danger-sm">Delete</button>
    <span class="save-status saved"><span class="sindot"></span>Saved</span>
  </div>
  <div class="cap"><b>Buttons</b><span>Gold-600 primary (the CTA glow), teal for navigation actions, ghost secondary, red destructive. 36px tall / 28px small.</span></div>
</body>
</html>
