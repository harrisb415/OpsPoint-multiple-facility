<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--card-bg); padding: 22px; color: var(--ink-900); }
  .row { display: flex; gap: 0; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-card); border: 1px solid var(--line); }
  .sw { flex: 1; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 9px; }
  .sw .n { font-size: 11px; font-weight: 700; }
  .sw .v { font-size: 10px; font-family: var(--font-mono); opacity: .8; }
  .cap { margin-top: 12px; display: flex; align-items: baseline; gap: 10px; }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--ink-900);color:#dfe8ee"><div class="n">ink-900</div><div class="v">#0f2430</div></div>
    <div class="sw" style="background:var(--ink-700);color:#e5edf2"><div class="n">ink-700</div><div class="v">#33485a</div></div>
    <div class="sw" style="background:var(--ink-500);color:#fff"><div class="n">ink-500</div><div class="v">#5c7081</div></div>
    <div class="sw" style="background:var(--ink-300);color:#33485a"><div class="n">ink-300</div><div class="v">#b7c4ce</div></div>
    <div class="sw" style="background:var(--line);color:#5c7081"><div class="n">line</div><div class="v">#e1e8ed</div></div>
    <div class="sw" style="background:var(--page-bg);color:#5c7081"><div class="n">page-bg</div><div class="v">#eaf1f4</div></div>
    <div class="sw" style="background:var(--card-bg);color:#5c7081"><div class="n">card</div><div class="v">#ffffff</div></div>
  </div>
  <div class="cap"><b>Ink &amp; Surfaces</b><span>Text deepens to a teal-tinted ink (not pure slate). Page background is cooler &amp; a touch deeper than the old flat grey; cards stay pure white.</span></div>
</body>
</html>
