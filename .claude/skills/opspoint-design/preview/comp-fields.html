<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/opspoint/opspoint.css">
<style>
  body { background: #fff; padding: 22px 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cap { margin-top: 16px; display: flex; align-items: baseline; gap: 10px; }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="row">
    <div class="field">
      <label>Program Assistant on Duty</label>
      <input type="text" value="D. Okonkwo" />
    </div>
    <div class="field">
      <label>Shift</label>
      <select><option>Swing Shift (3:00 PM – 11:00 PM)</option></select>
    </div>
    <div class="field" style="margin-bottom:0">
      <label>Date</label>
      <input type="text" value="2026-05-28" style="font-family:var(--font-mono)" />
    </div>
    <div class="field" style="margin-bottom:0">
      <label>Search roster</label>
      <input type="text" placeholder="Name or room…" />
    </div>
  </div>
  <div class="cap"><b>Form fields</b><span>36px inputs, uppercase eyebrow labels, gold focus ring (<code style="font-family:var(--font-mono);font-size:11px">glow-gold</code>). Selects &amp; date fields share the frame.</span></div>
</body>
</html>
