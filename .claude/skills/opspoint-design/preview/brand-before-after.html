<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--card-bg); padding: 22px; color: var(--ink-900); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); }
  .ptag { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 7px 12px; }
  .demo { display: flex; }
  .bar { width: 64px; }
  .body { flex: 1; padding: 12px; background: #fff; }
  .btn { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; padding: 7px 14px; border-radius: var(--r-sm); }
  .mini { font-size: 11px; color: var(--ink-500); margin-top: 9px; }
  .dotrow { display: flex; gap: 5px; margin-top: 9px; }
  .dotrow i { width: 16px; height: 16px; border-radius: 4px; display: block; }
  .cap { margin-top: 14px; display: flex; align-items: baseline; gap: 10px; }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="wrap">
    <!-- BEFORE -->
    <div class="panel">
      <div class="ptag" style="background:#f1f5f9;color:#64748b">Before · flat &amp; bland</div>
      <div class="demo">
        <div class="bar" style="background:#0f4c5c"></div>
        <div class="body">
          <span class="btn" style="background:#f97316">Primary</span>
          <div class="mini">Flat teal slab · web-orange · grey page</div>
          <div class="dotrow"><i style="background:#0f4c5c"></i><i style="background:#f97316"></i><i style="background:#f4f7f9;border:1px solid #e5e7eb"></i><i style="background:#dcfce7"></i><i style="background:#dbeafe"></i></div>
        </div>
      </div>
    </div>
    <!-- AFTER -->
    <div class="panel" style="box-shadow:var(--shadow-drop)">
      <div class="ptag" style="background:var(--gold-50);color:var(--gold-700)">After · jewel &amp; depth</div>
      <div class="demo">
        <div class="bar" style="background:var(--grad-sidebar)"></div>
        <div class="body">
          <span class="btn" style="background:var(--gold-600);box-shadow:0 2px 8px rgba(201,120,12,.4)">Primary</span>
          <div class="mini">Gradient teal · gold "door light" · tinted depth</div>
          <div class="dotrow"><i style="background:var(--teal-800)"></i><i style="background:var(--gold-500)"></i><i style="background:var(--page-bg)"></i><i style="background:var(--st-building-bg)"></i><i style="background:var(--st-work-bg)"></i></div>
        </div>
      </div>
    </div>
  </div>
  <div class="cap"><b>The soup-up</b><span>Same beloved layout — richer palette. Teal deepens into a gradient, orange becomes the icon's warm gold, neutrals gain depth.</span></div>
</body>
</html>
