<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--card-bg); padding: 22px; color: var(--ink-900); }
  .row { display: flex; gap: 0; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-card); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 9px; }
  .sw .n { font-size: 11px; font-weight: 700; font-family: var(--font-mono); }
  .sw .v { font-size: 10px; font-family: var(--font-mono); opacity: .82; }
  .cap { margin-top: 12px; display: flex; align-items: baseline; gap: 10px; }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--teal-950);color:#cfe9f0"><div class="n">950</div><div class="v">#062a33</div></div>
    <div class="sw" style="background:var(--teal-900);color:#cfe9f0"><div class="n">900</div><div class="v">#07333f</div></div>
    <div class="sw" style="background:var(--teal-800);color:#d4eef4"><div class="n">800</div><div class="v">#0a4655</div></div>
    <div class="sw" style="background:var(--teal-700);color:#d4eef4"><div class="n">700</div><div class="v">#0d5a6e</div></div>
    <div class="sw" style="background:var(--teal-600);color:#eef8fb"><div class="n">600</div><div class="v">#106f88</div></div>
    <div class="sw" style="background:var(--teal-500);color:#06303a"><div class="n">500</div><div class="v">#1589a6</div></div>
    <div class="sw" style="background:var(--teal-300);color:#06303a"><div class="n">300</div><div class="v">#74c6da</div></div>
    <div class="sw" style="background:var(--teal-100);color:#0a4655"><div class="n">100</div><div class="v">#d4eef4</div></div>
    <div class="sw" style="background:var(--teal-50);color:#0a4655"><div class="n">50</div><div class="v">#eef8fb</div></div>
  </div>
  <div class="cap"><b>Brand · Teal</b><span>Clinical anchor — navigation, headers, links, structure. Deepened &amp; jewel-saturated from the original flat #0f4c5c.</span></div>
</body>
</html>
