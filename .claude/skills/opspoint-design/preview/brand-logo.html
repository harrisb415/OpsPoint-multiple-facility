<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--card-bg); padding: 22px; color: var(--ink-900); }
  .lockups { display: flex; gap: 16px; align-items: stretch; }
  .lk { flex: 1; border-radius: var(--r-lg); border: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 16px 18px; }
  .lk.dark { background: var(--grad-sidebar); border-color: transparent; }
  .lk img { width: 48px; height: 48px; border-radius: var(--r-md); box-shadow: var(--shadow-card); }
  .lk .nm { font-size: 20px; font-weight: 700; letter-spacing: var(--tracking-tight); }
  .lk .nm.on-dark { color: #fff; }
  .lk .sub { font-size: 11px; color: var(--ink-500); margin-top: 1px; }
  .lk .sub.on-dark { color: var(--teal-200); }
  .cap { margin-top: 14px; display: flex; align-items: baseline; gap: 10px; }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="lockups">
    <div class="lk">
      <img src="../assets/opspoint-icon.png" alt="OpsPoint">
      <div><div class="nm" style="color:var(--teal-800)">OpsPoint</div><div class="sub">Shift management · on light</div></div>
    </div>
    <div class="lk dark">
      <img src="../assets/opspoint-icon.png" alt="OpsPoint">
      <div><div class="nm on-dark">OpsPoint</div><div class="sub on-dark">Shift management · on teal</div></div>
    </div>
  </div>
  <div class="cap"><b>Logo &amp; lockup</b><span>App mark = navy disc + glowing gold doorway (the "way forward"). Wordmark sets in bold system sans. The icon's own palette drives the whole system.</span></div>
</body>
</html>
