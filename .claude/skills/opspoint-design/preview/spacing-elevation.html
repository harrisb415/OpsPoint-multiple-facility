<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--page-bg); padding: 26px 24px; color: var(--ink-900); }
  .row { display: flex; gap: 20px; }
  .item { flex: 1; text-align: center; }
  .box { height: 64px; background: #fff; border-radius: var(--r-lg); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--ink-500); }
  .lab { font-size: 11px; font-weight: 700; margin-top: 12px; }
  .val { font-size: 9px; font-family: var(--font-mono); color: var(--ink-400); margin-top: 2px; }
  .cap { margin-top: 18px; display: flex; align-items: baseline; gap: 10px; background: #fff; padding: 11px 14px; border-radius: var(--r-md); }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)">xs</div><div class="lab">xs</div><div class="val">hairline</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-card)">card</div><div class="lab">card</div><div class="val">resting</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-drop)">drop</div><div class="lab">drop</div><div class="val">hover / popover</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-modal)">modal</div><div class="lab">modal</div><div class="val">overlay</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--glow-gold);border:1px solid var(--gold-300)">glow</div><div class="lab">glow-gold</div><div class="val">focus ring</div></div>
  </div>
  <div class="cap"><b>Elevation</b><span>Shadows are tinted with the brand teal (rgba 7,51,63) — warmer &amp; richer than pure black. Gold glow marks focus.</span></div>
</body>
</html>
