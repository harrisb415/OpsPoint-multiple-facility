<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--card-bg); padding: 22px 24px; color: var(--ink-900); }
  .scale { display: flex; flex-direction: column; gap: 9px; }
  .r { display: flex; align-items: center; gap: 12px; }
  .bar { background: var(--gold-400); height: 16px; border-radius: 3px; }
  .tok { font-size: 11px; font-weight: 700; width: 44px; }
  .px { font-size: 10px; font-family: var(--font-mono); color: var(--ink-400); }
  .cap { margin-top: 16px; display: flex; align-items: baseline; gap: 10px; }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="scale">
    <div class="r"><span class="tok">sp-1</span><span class="bar" style="width:4px"></span><span class="px">4px</span></div>
    <div class="r"><span class="tok">sp-2</span><span class="bar" style="width:8px"></span><span class="px">8px</span></div>
    <div class="r"><span class="tok">sp-3</span><span class="bar" style="width:12px"></span><span class="px">12px</span></div>
    <div class="r"><span class="tok">sp-4</span><span class="bar" style="width:16px"></span><span class="px">16px</span></div>
    <div class="r"><span class="tok">sp-5</span><span class="bar" style="width:20px"></span><span class="px">20px</span></div>
    <div class="r"><span class="tok">sp-6</span><span class="bar" style="width:24px"></span><span class="px">24px · card / container padding</span></div>
    <div class="r"><span class="tok">sp-8</span><span class="bar" style="width:32px"></span><span class="px">32px</span></div>
    <div class="r"><span class="tok">sp-10</span><span class="bar" style="width:40px"></span><span class="px">40px</span></div>
  </div>
  <div class="cap"><b>Spacing scale</b><span>4px base. Cards pad to 20–24px, controls to 36px tall, gaps step in 4s. Keeps the dense operational grid tidy.</span></div>
</body>
</html>
