<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--card-bg); padding: 22px 24px; color: var(--ink-900); }
  .demo { display: flex; gap: 22px; align-items: center; }
  .stat { text-align: center; }
  .stat .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 30px; line-height: 1; color: var(--teal-600); }
  .stat .lab { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-500); margin-top: 5px; }
  .logrows { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .lr { display: flex; gap: 12px; align-items: baseline; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 11px; }
  .lr .t { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; color: var(--teal-600); }
  .lr .m { font-size: 13px; color: var(--ink-900); }
  .cap { margin-top: 14px; display: flex; align-items: baseline; gap: 10px; }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="demo">
    <div class="stat"><div class="num">38</div><div class="lab">In Building</div></div>
    <div class="logrows">
      <div class="lr"><span class="t">8:15 PM</span><span class="m">Wellness check conducted · all 41 accounted for</span></div>
      <div class="lr"><span class="t">9:02 PM</span><span class="m">Building walkthrough · all areas clear</span></div>
      <div class="lr"><span class="t">10:30 PM</span><span class="m">Rm 214 — UA collected, witnessed</span></div>
    </div>
  </div>
  <div class="cap"><b>Tabular numbers in use</b><span>Monospace + <code style="font-family:var(--font-mono);font-size:11px">tabular-nums</code> keep times, counts &amp; room numbers vertically aligned across every row.</span></div>
</body>
</html>
