<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/opspoint/opspoint.css">
<style>
  body { background: #fff; padding: 22px 24px; }
  .grp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .cap { margin-top: 6px; display: flex; align-items: baseline; gap: 10px; }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="grp">
    <span class="badge badge-green"><span class="badge-dot"></span>Accounted for</span>
    <span class="badge badge-blue">At Work</span>
    <span class="badge badge-yellow">On Pass</span>
    <span class="badge badge-red">Overdue</span>
    <span class="badge badge-gray">Vacant</span>
  </div>
  <div class="grp">
    <button class="pill pill-green">✓ Wellness Check</button>
    <button class="pill pill-blue">⊕ Walkthrough</button>
    <button class="pill pill-yellow">🧪 UA</button>
    <button class="pill pill-slate">🔎 Room Search</button>
    <button class="pill pill-red">⚠ Violation</button>
  </div>
  <div class="cap"><b>Badges &amp; quick-action pills</b><span>Status badges read-only; quick-action pills (lifted on hover) launch the logging modals from the activity log.</span></div>
</body>
</html>
