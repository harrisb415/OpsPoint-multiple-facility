<!DOCTYPE html>
<html lang="en">
<head>
<script>
if(location.protocol==='file:'){document.addEventListener('DOMContentLoaded',function(){document.body.innerHTML='<div style="font-family:sans-serif;padding:40px;text-align:center;background:#1C0A10;min-height:100vh;display:flex;align-items:center;justify-content:center;"><div style="background:#fff;border-radius:16px;padding:36px;max-width:400px;"><div style="font-size:3rem;margin-bottom:16px;">📡</div><h2 style="color:#1C0A10;margin-bottom:12px;">Wrong URL</h2><p style="color:#7A5462;line-height:1.6;">The mobile app must be opened through the server.</p></div></div>';});}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C0A10">
<title>ShiftPoint</title>
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --dark:#1C0A10;--crimson:#7B1535;--mid:#9C2040;--orange:#E06020;--gold:#D4A017;
  --bg:#F4F6F8;--white:#fff;--line:#E2E8F0;--steel:#4B5563;--muted:#94A3B8;
  --green-ok:#14532d;--green-bg:#d8f3dc;
  --sans:'Outfit',sans-serif;--mono:'IBM Plex Mono',monospace;
}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:#1C0A10;overscroll-behavior:none;overflow:hidden;}

/* ── Shell ─────────────────────────────────────────────── */
#shell{display:flex;flex-direction:column;height:100vh;height:100dvh;}
#app-header{flex-shrink:0;background:var(--dark);color:#fff;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.5);border-bottom:3px solid var(--orange);}
#app-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;}
#bottom-nav{flex-shrink:0;background:var(--dark);border-top:1px solid rgba(255,255,255,.1);display:flex;padding-bottom:env(safe-area-inset-bottom);}

/* ── Header ────────────────────────────────────────────── */
.hdr-top{display:flex;align-items:center;gap:10px;padding:10px 14px;}
.hdr-logo{height:32px;width:32px;border-radius:7px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.hdr-names{flex:1;min-width:0;}
.hdr-title{font-size:1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:.6rem;color:#C8A0AA;letter-spacing:.08em;text-transform:uppercase;}
.hdr-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.hdr-btn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:5px 9px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:var(--sans);white-space:nowrap;text-decoration:none;display:inline-block;}
.hdr-btn:active{background:rgba(255,255,255,.2);}
.live-dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;flex-shrink:0;}
.live-dot.on{background:#4ade80;box-shadow:0 0 6px #4ade80;animation:pulse 2s infinite;}
.live-dot.off{background:#ef4444;box-shadow:0 0 6px #ef4444;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Shift bar ─────────────────────────────────────────── */
#shift-bar{display:flex;align-items:center;gap:0;border-top:1px solid rgba(255,255,255,.1);overflow:hidden;}
.shift-field{flex:1;padding:7px 10px;border-right:1px solid rgba(255,255,255,.1);}
.shift-field:last-child{border-right:none;}
.sf-label{font-size:.55rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7A5462;margin-bottom:1px;}
.sf-val{font-size:.82rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sf-input{background:transparent;border:none;outline:none;color:#fff;font-size:.82rem;font-weight:700;font-family:var(--sans);width:100%;padding:0;}

/* ── Reminder bar ──────────────────────────────────────── */
#rem-bar{display:none;background:#7B1535;color:#fff;padding:8px 14px;font-size:.8rem;font-weight:700;align-items:center;gap:10px;border-top:1px solid rgba(255,255,255,.2);animation:pulse-bg 2s infinite;}
#rem-bar.active{display:flex;}
@keyframes pulse-bg{0%,100%{opacity:1}50%{opacity:.88}}
#rem-bar .rem-dismiss{margin-left:auto;background:rgba(255,255,255,.2);border:none;color:#fff;padding:4px 10px;border-radius:5px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:var(--sans);}

/* ── UA banner ─────────────────────────────────────────── */
#ua-banner{display:none;background:#C8500A;color:#fff;padding:8px 14px;font-size:.8rem;font-weight:700;align-items:center;gap:10px;}
#ua-banner.active{display:flex;}
#ua-banner .ua-ack-btn{margin-left:auto;background:rgba(255,255,255,.2);border:none;color:#fff;padding:4px 10px;border-radius:5px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:var(--sans);}

/* ── Bottom nav ────────────────────────────────────────── */
.nav-btn{flex:1;background:transparent;border:none;color:#5A3042;cursor:pointer;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--sans);}
.nav-btn .nav-icon{font-size:1.3rem;line-height:1;}
.nav-btn .nav-label{font-size:.58rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.nav-btn.active{color:#fff;}
.nav-btn.active .nav-icon{filter:drop-shadow(0 0 4px rgba(224,96,32,.8));}

/* ── Panels ────────────────────────────────────────────── */
.panel{display:none;}.panel.active{display:block;}

/* ── Common card ───────────────────────────────────────── */
.card{background:#fff;border-radius:10px;border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.07);}
.section-head{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 14px 5px;}

/* ── Status badges ─────────────────────────────────────── */
.sb{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.s-building{background:#d8f3dc;color:#14532d;}
.s-work{background:#dbeafe;color:#1d4ed8;}
.s-pass{background:#fef9c3;color:#854d0e;}
.s-bhc{background:#ede9fe;color:#6d28d9;}
.s-efc{background:#fce7f3;color:#be185d;}
.s-hospital{background:#fee2e2;color:#991b1b;}
.s-out{background:#fff7ed;color:#9a3412;}
.s-vacant{background:#f1f5f9;color:#94a3b8;}

/* ── Roster ────────────────────────────────────────────── */
#panel-roster{padding:8px 12px 16px;}
.res-card{background:#fff;border-radius:10px;padding:11px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;}
.res-card:active{transform:scale(.98);}
.res-room{font-size:.72rem;font-weight:700;color:var(--steel);font-family:var(--mono);min-width:30px;text-align:center;}
.res-info{flex:1;min-width:0;}
.res-name{font-size:.94rem;font-weight:700;color:#0F172A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.res-detail{font-size:.7rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.res-actions{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.ua-btn{width:34px;height:34px;border-radius:50%;border:2px solid #C8500A;background:#fff3eb;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ua-btn:active{background:#C8500A;color:#fff;}

/* ── Log ───────────────────────────────────────────────── */
#panel-log{padding:8px 12px 80px;}
.log-card{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:6px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.05);}
.log-ts{font-size:.72rem;font-weight:700;color:var(--crimson);font-family:var(--mono);margin-bottom:3px;}
.log-txt{font-size:.87rem;color:#0F172A;line-height:1.45;}
.log-del{float:right;background:none;border:none;color:var(--muted);font-size:.8rem;cursor:pointer;padding:2px 4px;margin-left:8px;}
.log-del:active{color:#991b1b;}
.fab{position:fixed;bottom:calc(56px + env(safe-area-inset-bottom) + 12px);right:14px;width:52px;height:52px;border-radius:50%;background:var(--crimson);color:#fff;border:none;font-size:1.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(123,21,53,.45);z-index:50;}
.fab:active{background:var(--mid);}

/* ── Staff ─────────────────────────────────────────────── */
#panel-staff{padding:4px 12px 80px;}
.staff-card{background:#fff;border-radius:9px;padding:11px 13px;margin-bottom:6px;border:1px solid var(--line);display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
.staff-card:active{background:#F8FAFC;}
.staff-avi{width:34px;height:34px;border-radius:50%;background:var(--crimson);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:800;flex-shrink:0;}
.staff-info{flex:1;min-width:0;}
.staff-name{font-size:.92rem;font-weight:700;color:#0F172A;}
.staff-phone{font-size:.78rem;color:var(--crimson);font-family:var(--mono);margin-top:2px;}
.staff-notes{font-size:.74rem;color:var(--steel);margin-top:2px;line-height:1.35;}
.staff-edit-btn{background:none;border:none;color:var(--muted);font-size:.8rem;cursor:pointer;padding:2px 4px;flex-shrink:0;}

/* ── Chores ────────────────────────────────────────────── */
#panel-chores{padding:8px 12px 80px;}
.chore-card{background:#fff;border-radius:9px;padding:11px 13px;margin-bottom:6px;border:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.chore-check{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.chore-check.done{background:var(--green-bg);border-color:#86efac;}
.chore-info{flex:1;min-width:0;}
.chore-name{font-size:.9rem;font-weight:700;color:#0F172A;}
.chore-res{font-size:.74rem;color:var(--steel);margin-top:2px;}
.chore-initial{font-size:.72rem;font-weight:700;color:var(--green-ok);margin-top:2px;}

/* ── Passes ────────────────────────────────────────────── */
#panel-passes{padding:8px 12px 80px;}
.pass-notice{background:var(--dark);color:#fff;border-radius:9px;padding:12px 14px;margin-bottom:10px;font-size:.84rem;line-height:1.5;}
.pass-notice-label{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#C8A0AA;margin-bottom:4px;}
.pass-card{background:#fff;border-radius:9px;padding:11px 13px;margin-bottom:7px;border:1px solid var(--line);cursor:pointer;}
.pass-card:active{background:#F8FAFC;}
.pass-card-top{display:flex;align-items:center;gap:10px;}
.pass-client{font-size:.92rem;font-weight:700;color:#0F172A;flex:1;}
.pass-status-badge{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:20px;}
.pass-status-badge.out{background:#fff7ed;color:#9a3412;}
.pass-status-badge.returned{background:#d8f3dc;color:#14532d;}
.pass-status-badge.late{background:#fee2e2;color:#991b1b;}
.pass-dates{font-size:.75rem;color:var(--steel);margin-top:4px;}

/* ── Report archive rows ───────────────────────────────── */
.report-row{background:#fff;border-radius:9px;padding:11px 13px;margin-bottom:6px;border:1px solid var(--line);display:flex;align-items:center;gap:10px;cursor:pointer;}
.report-row:active{background:#F8FAFC;}
.report-row.viewing{border-color:var(--crimson);background:#FFF5F7;}
.report-row-left{flex:1;min-width:0;}
.report-date{font-size:.92rem;font-weight:700;color:#0F172A;}
.report-meta{font-size:.74rem;color:var(--steel);margin-top:1px;}
.rpt-badge{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.active-badge{background:#d8f3dc;color:#14532d;}
.view-badge{background:#dbeafe;color:#1d4ed8;}
.rpt-del-btn{background:none;border:none;color:var(--muted);font-size:.8rem;cursor:pointer;padding:4px 6px;border-radius:5px;}
.rpt-del-btn:active{color:#991b1b;background:#fee2e2;}

/* ── More ──────────────────────────────────────────────── */
#panel-more{padding:8px 12px 80px;}
.more-section{margin-bottom:16px;}
.more-row{background:#fff;border-radius:9px;padding:13px 14px;margin-bottom:6px;border:1px solid var(--line);display:flex;align-items:center;gap:12px;cursor:pointer;}
.more-row:active{background:#F8FAFC;}
.more-icon{font-size:1.3rem;width:32px;text-align:center;flex-shrink:0;}
.more-label{font-size:.92rem;font-weight:700;color:#0F172A;flex:1;}
.more-badge{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:20px;background:#fee2e2;color:#991b1b;}
.more-row.danger{background:#FFF5F5;}
.more-row.danger .more-label{color:#991b1b;}
.mail-card{background:#fff;border-radius:9px;padding:11px 13px;margin-bottom:7px;border:1px solid var(--line);}
.mail-card-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.mail-status{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px;}
.mail-status.pending{background:#fff7ed;color:#9a3412;}
.mail-status.approved{background:#d8f3dc;color:#14532d;}
.mail-status.delivered{background:#dbeafe;color:#1d4ed8;}

/* ── Modals ────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:0 0 max(16px,env(safe-area-inset-bottom));animation:slide-up .22s ease;}
@keyframes slide-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:#CBD5E1;margin:10px auto 0;}
.sheet-head{padding:12px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
.sheet-title{font-size:1rem;font-weight:800;color:#0F172A;}
.sheet-close{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--muted);padding:2px 6px;}
.sheet-body{padding:14px 18px;}
.sheet-body label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);margin-bottom:5px;margin-top:12px;}
.sheet-body label:first-child{margin-top:0;}
.sheet-input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;font-size:.95rem;font-family:var(--sans);color:#0F172A;outline:none;}
.sheet-input:focus{border-color:var(--crimson);}
.sheet-textarea{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:8px;font-size:.9rem;font-family:var(--sans);resize:none;height:72px;outline:none;}
.sheet-textarea:focus{border-color:var(--crimson);}
.sheet-select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;font-size:.95rem;font-family:var(--sans);background:#fff;color:#0F172A;outline:none;}
.sheet-select:focus{border-color:var(--crimson);}
.sheet-footer{padding:10px 18px 2px;display:flex;gap:8px;}
.btn-primary{flex:1;padding:13px;background:var(--crimson);color:#fff;border:none;border-radius:9px;font-size:.95rem;font-weight:800;font-family:var(--sans);cursor:pointer;}
.btn-primary:active{background:var(--mid);}
.btn-secondary{padding:13px 18px;background:#F1F5F9;color:var(--steel);border:none;border-radius:9px;font-size:.95rem;font-weight:700;font-family:var(--sans);cursor:pointer;}
.btn-secondary:active{background:#E2E8F0;}
.btn-danger{padding:13px 18px;background:#FEE2E2;color:#991b1b;border:none;border-radius:9px;font-size:.95rem;font-weight:700;font-family:var(--sans);cursor:pointer;}
.btn-danger:active{background:#FECACA;}

/* ── Status picker ─────────────────────────────────────── */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px;}
.status-opt{padding:13px 10px;border-radius:10px;border:2px solid var(--line);cursor:pointer;text-align:center;font-size:.82rem;font-weight:700;transition:all .12s;}
.status-opt:active{transform:scale(.97);}
.status-opt.active-status{border-color:var(--crimson);background:#FFF5F7;}

/* ── Toast ─────────────────────────────────────────────── */
#toast{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-100px);background:#1A3327;color:#fff;padding:10px 20px;border-radius:8px;font-size:.86rem;font-weight:700;z-index:9999;transition:transform .28s ease;pointer-events:none;border-left:3px solid #D4A017;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.err{background:#7B1535;border-left-color:var(--orange);}

/* ── Empty states ──────────────────────────────────────── */
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:.88rem;}

/* ── Green theme ───────────────────────────────────────── */
body.theme-green{--dark:#1A3327;--crimson:#2D6A4F;--mid:#1A5C42;--orange:#D4A017;}
body.theme-green #rem-bar{background:#1A5C42;}
body.theme-green .log-ts{color:#2D6A4F;}
body.theme-green .fab{background:#2D6A4F;}
body.theme-green .staff-avi{background:#2D6A4F;}
body.theme-green .btn-primary{background:#2D6A4F;}
body.theme-green .btn-primary:active{background:#1A5C42;}
body.theme-green .status-opt.active-status{border-color:#2D6A4F;background:#F0FAF4;}
body.theme-green .ua-btn{border-color:#C8500A;}
body.theme-green #ua-banner{background:#C8500A;}
body.theme-green .sheet-input:focus,.sheet-textarea:focus,.sheet-select:focus{border-color:#2D6A4F;}
</style>
</head>
<body>
<div id="shell">

  <!-- ── Header ─────────────────────────────────────────── -->
  <header id="app-header">
    <div class="hdr-top">
      <img src="/static/icons/icon-192.png" alt="" class="hdr-logo">
      <div class="hdr-names">
        <div class="hdr-title" id="hdr-facility">ShiftPoint</div>
        <div class="hdr-sub" id="hdr-user">Loading…</div>
      </div>
      <div class="hdr-actions">
        <a href="/mobile.html" class="hdr-btn" title="Switch to Basic Mode">Basic</a>
        <a href="/?desktop=1" class="hdr-btn" title="Switch to Desktop">🖥</a>
        <form method="POST" action="/logout" style="margin:0;">
          <button type="submit" class="hdr-btn">Out</button>
        </form>
        <div class="live-dot" id="live-dot" title="Connecting…"></div>
      </div>
    </div>
    <div id="shift-bar">
      <div class="shift-field">
        <div class="sf-label">Date</div>
        <div class="sf-val" id="sf-date">—</div>
      </div>
      <div class="shift-field">
        <div class="sf-label">Shift</div>
        <div class="sf-val" id="sf-shift">—</div>
      </div>
      <div class="shift-field">
        <div class="sf-label">MOD</div>
        <div class="sf-val" id="sf-mod">—</div>
      </div>
    </div>
    <div id="rem-bar">
      <span id="rem-msg">⚠ Reminder</span>
      <button class="rem-dismiss" onclick="dismissReminder()">✓ Got it</button>
    </div>
    <div id="ua-banner">
      <span id="ua-banner-msg">🧪 UA Requests pending</span>
      <button class="ua-ack-btn" onclick="acknowledgeAllUA()">✓ Acknowledge All</button>
    </div>
  </header>

  <!-- ── Content ─────────────────────────────────────────── -->
  <main id="app-content">

    <!-- ROSTER -->
    <div class="panel active" id="panel-roster">
      <div id="roster-list"><div class="empty">Loading…</div></div>
    </div>

    <!-- LOG -->
    <div class="panel" id="panel-log">
      <div id="log-list"><div class="empty">Loading…</div></div>
    </div>

    <!-- STAFF -->
    <div class="panel" id="panel-staff">
      <div id="staff-list"><div class="empty">Loading…</div></div>
    </div>

    <!-- CHORES -->
    <div class="panel" id="panel-chores">
      <div id="chores-list"><div class="empty">Loading…</div></div>
    </div>

    <!-- PASSES -->
    <div class="panel" id="panel-passes">
      <div id="passes-list"><div class="empty">Loading…</div></div>
    </div>

    <!-- MORE -->
    <div class="panel" id="panel-more">
      <div id="more-content"><div class="empty">Loading…</div></div>
    </div>

  </main>

  <!-- ── Bottom nav ───────────────────────────────────────── -->
  <nav id="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('roster',this)" id="nav-roster">
      <span class="nav-icon">🏠</span><span class="nav-label">Roster</span>
    </button>
    <button class="nav-btn" onclick="switchTab('log',this)" id="nav-log">
      <span class="nav-icon">📋</span><span class="nav-label">Log</span>
    </button>
    <button class="nav-btn" onclick="switchTab('staff',this)" id="nav-staff">
      <span class="nav-icon">👥</span><span class="nav-label">Staff</span>
    </button>
    <button class="nav-btn" onclick="switchTab('chores',this)" id="nav-chores">
      <span class="nav-icon">✅</span><span class="nav-label">Chores</span>
    </button>
    <button class="nav-btn" onclick="switchTab('passes',this)" id="nav-passes">

<!-- SCRIPT                                                 -->
<!-- ══════════════════════════════════════════════════════ -->
<script>
'use strict';
// ── Permission helper ────────────────────────────────────
function hasPerm(p){return window.SESSION&&Array.isArray(window.SESSION.permissions)&&window.SESSION.permissions.includes(p);}

// ── State ────────────────────────────────────────────────
var CLIENTS=[], REPORTS=[], CURRENT_RPT=null, SHIFT_STATUSES={}, LOG_ENTRIES=[];
var STAFF=[], STAFF_CATS=[], PASSES=[], MASTER_CHORES=[], CHORE_LOG=[], PASS_NOTICE='';
var MAIL_LOG=[], UA_REQUESTS=[], SETTINGS={};
var WALK_AREAS=[], WELLNESS_INTERVAL=120, WALK_INTERVAL=240;
var WELLNESS_SCHEDULE=[], WALK_SCHEDULE=[];
var _activeTab='roster', _editClientId=null, _editPassId=null, _editStaffId=null;
var _systemActiveId=null; // server's active_report_id, separate from which report we're locally viewing
var _logPhotoB64=null, _remDismissed=false, _ownPatch=null;

// ── Theme ────────────────────────────────────────────────
(function(){
  var t=localStorage.getItem('sp-theme')||'green';
  if(t==='green') document.body.classList.add('theme-green');
})();

// ── Escape helper ────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ── Toast ────────────────────────────────────────────────
var _toastTimer=null;
function showToast(msg,type){
  var t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;
  t.className='show'+(type==='err'?' err':'');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(function(){t.className='';},type==='err'?4500:2800);
}

// ── Tab switching ────────────────────────────────────────
function switchTab(name,btn){
  _activeTab=name;
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  var p=document.getElementById('panel-'+name);
  if(p)p.classList.add('active');
  if(btn)btn.classList.add('active');
  var fab=document.getElementById('fab');
  if(fab){
    var showFab=(name==='log'&&hasPerm('log.add'))||(name==='passes'&&hasPerm('passes.edit'))||(name==='staff'&&hasPerm('staff.edit'));
    fab.style.display=showFab?'flex':'none';
  }
  if(name==='roster') renderRoster();
  else if(name==='log')    renderLog();
  else if(name==='staff')  renderStaff();
  else if(name==='chores') renderChores();
  else if(name==='passes') renderPasses();
  else if(name==='more')   renderMore();
}
function fabAction(){
  if(_activeTab==='log') openLogSheet();
  else if(_activeTab==='passes') openPassSheet(null);
  else if(_activeTab==='staff') openStaffSheet(null);
}

// ── WebSocket ────────────────────────────────────────────
var ws, wsTimer;
function connectWS(){
  var proto=location.protocol==='https:'?'wss:':'ws:';
  try{ws=new WebSocket(proto+'//'+location.host);}catch(e){setDot(false);return;}
  ws.onopen=function(){setDot(true);};
  ws.onclose=function(){setDot(false);ws=null;wsTimer=setTimeout(connectWS,3000);};
  ws.onerror=function(){try{ws.close();}catch(e){}};
  ws.onmessage=function(e){
    try{var msg=JSON.parse(e.data);}catch(ex){return;}
    if(msg.type==='data_saved'){loadAll();}
    else if(msg.type==='patched'){applyPatch(msg.patch);}
    else if(msg.type==='staff_updated'){STAFF=msg.staff||STAFF;STAFF_CATS=msg.categories||STAFF_CATS;if(_activeTab==='staff')renderStaff();}
    else if(msg.type==='passes_updated'){PASSES=msg.passes||PASSES;if(_activeTab==='passes')renderPasses();}
    else if(msg.type==='pass_notice_updated'){PASS_NOTICE=msg.notice||'';if(_activeTab==='passes')renderPasses();}
    else if(msg.type==='settings_updated'){if(msg.settings)applySettings(msg.settings);checkReminders();}
    else if(msg.type==='ua_request'){UA_REQUESTS=msg.requests||[];checkUABanner();if(_activeTab==='more')renderMore();}
    else if(msg.type==='user_deleted'){if(window.SESSION&&msg.userId===window.SESSION.id)location.replace('/login');}
  };
}
function setDot(on){
  var d=document.getElementById('live-dot');
  if(d){d.className='live-dot '+(on?'on':'off');}
}

// ── Apply patch (real-time status/log update) ────────────
function applyPatch(patch){
  if(!patch)return;
  if(_ownPatch&&JSON.stringify(_ownPatch)===JSON.stringify(patch)){_ownPatch=null;return;}
  if(patch.reportId&&CURRENT_RPT&&patch.reportId===CURRENT_RPT.id){
    if(patch.statuses){Object.assign(SHIFT_STATUSES,patch.statuses);}
    if(patch.log_entry){LOG_ENTRIES.push(patch.log_entry);renderLog();}
  }
  renderRoster();
  if(_activeTab==='log')renderLog();
  checkReminders();
}

// ── Settings ─────────────────────────────────────────────
function applySettings(cfg){
  if(!cfg)return;
  if(cfg.facility_name){
    document.getElementById('hdr-facility').textContent=cfg.facility_name;
    window.FACILITY_NAME=cfg.facility_name;
  }
  if(cfg.walk_areas&&cfg.walk_areas.length)WALK_AREAS=cfg.walk_areas;
  if(cfg.wellness_interval_mins!=null)WELLNESS_INTERVAL=cfg.wellness_interval_mins;
  if(cfg.walk_interval_mins!=null)WALK_INTERVAL=cfg.walk_interval_mins;
  if(cfg.wellness_schedule)WELLNESS_SCHEDULE=cfg.wellness_schedule;
  if(cfg.walk_schedule)WALK_SCHEDULE=cfg.walk_schedule;
}

// ── Load all data ────────────────────────────────────────
async function loadAll(){
  try{
    var r=await fetch('/api/data',{credentials:'include'});
    if(!r.ok)return;
    var d=await r.json();
    CLIENTS=d.clients||[];
    REPORTS=d.reports||[];
    SETTINGS=d;
    applySettings(d);  // settings live at root of d, not d.settings
    // Extended data is all in the same response
    STAFF=d.staff||[];
    STAFF_CATS=d.staff_categories||[];
    PASSES=d.passes||[];
    MASTER_CHORES=d.master_chores||[];
    PASS_NOTICE=d.pass_notice||'';
    CHORE_LOG=d.chore_log||[];
    // Find active report (active_report_id is at root of d)
    var aid=d.active_report_id;
    _systemActiveId=aid||null;
    CURRENT_RPT=null;
    if(aid){CURRENT_RPT=REPORTS.find(function(rpt){return rpt.id===aid;})||null;}
    if(!CURRENT_RPT&&REPORTS.length){CURRENT_RPT=REPORTS[REPORTS.length-1];}
    // Parse statuses and log entries (log_entries are embedded in each report by getAllData)
    SHIFT_STATUSES={};
    if(CURRENT_RPT){
      var ss=CURRENT_RPT.statuses;
      if(typeof ss==='string'){try{ss=JSON.parse(ss);}catch(e){ss={};}}
      Object.assign(SHIFT_STATUSES,ss||{});
      LOG_ENTRIES=CURRENT_RPT.log_entries||[];
    }
    // Mail and UA requests need separate endpoints
    try{var mr=await fetch('/api/mail',{credentials:'include'});if(mr.ok)MAIL_LOG=await mr.json();}catch(e){MAIL_LOG=[];}
    try{var ur=await fetch('/api/ua-requests',{credentials:'include'});if(ur.ok)UA_REQUESTS=await ur.json();}catch(e){UA_REQUESTS=[];}
    updateShiftBar();
    // Render whichever tab is active (switchTab handles this, but on initial load the tab hasn't been switched)
    renderRoster();
    if(_activeTab==='log')    renderLog();
    if(_activeTab==='staff')  renderStaff();
    if(_activeTab==='chores') renderChores();
    if(_activeTab==='passes') renderPasses();
    if(_activeTab==='more')   renderMore();
    checkReminders();
    checkUABanner();
  }catch(ex){showToast('Load failed','err');}
}

// ── Shift bar ────────────────────────────────────────────
function updateShiftBar(){
  if(!CURRENT_RPT)return;
  var canEdit=hasPerm('reports.close');
  var df=document.getElementById('sf-date');
  var sf=document.getElementById('sf-shift');
  var mf=document.getElementById('sf-mod');
  if(!df)return;
  if(canEdit){
    df.innerHTML='<input class="sf-input" id="sf-date-inp" type="date" value="'+esc(CURRENT_RPT.report_date||'')+'" onchange="saveShiftField(\'date\',this.value)">';
    sf.innerHTML='<select class="sf-input" id="sf-shift-inp" onchange="saveShiftField(\'shift\',this.value)" style="cursor:pointer;">'
      +['Day Shift','Evening Shift','Overnight Shift'].map(function(s){return'<option'+(CURRENT_RPT.shift===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select>';
    mf.innerHTML='<input class="sf-input" id="sf-mod-inp" type="text" value="'+esc(CURRENT_RPT.mod_name||'')+'" placeholder="MOD name" onblur="saveShiftField(\'mod\',this.value)">';
  }else{
    df.textContent=CURRENT_RPT.report_date||'—';
    sf.textContent=(CURRENT_RPT.shift||'—').replace(' Shift','');
    mf.textContent=CURRENT_RPT.mod_name||'—';
  }
}
async function saveShiftField(field,val){
  if(!CURRENT_RPT)return;
  // Server expects patch.shiftData with report_date/shift/mod_name keys
  var shiftData={};
  if(field==='date'){shiftData.report_date=val;CURRENT_RPT.report_date=val;}
  else if(field==='shift'){shiftData.shift=val;CURRENT_RPT.shift=val;}
  else if(field==='mod'){shiftData.mod_name=val;CURRENT_RPT.mod_name=val;}
  try{
    await fetch('/api/data',{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'include',
      body:JSON.stringify({reportId:CURRENT_RPT.id,shiftData:shiftData})});
  }catch(e){}
}

// ── Status constants ─────────────────────────────────────
var STATUS_OPTS=[
  {key:'building',label:'In Building',   cls:'s-building'},
  {key:'work',    label:'At Work',        cls:'s-work'},
  {key:'pass',    label:'Weekend Pass',   cls:'s-pass'},
  {key:'bhc',     label:'BHC',            cls:'s-bhc'},
  {key:'efc',     label:'EFC',            cls:'s-efc'},
  {key:'hospital',label:'Hospital',       cls:'s-hospital'},
  {key:'out',     label:'Out / Other',    cls:'s-out'},
];

// ── Roster ───────────────────────────────────────────────
function renderRoster(){
  var list=document.getElementById('roster-list');
  if(!list)return;
  var active=CLIENTS.filter(function(c){return c.is_active&&!c.is_special&&c.name!=='VACANT';});
  if(!active.length){list.innerHTML='<div class="empty">No active residents.</div>';return;}
  active.sort(function(a,b){return (parseInt(a.room)||0)-(parseInt(b.room)||0)||(a.room>b.room?1:-1);});
  var canEdit=hasPerm('status.edit');
  var canUA=hasPerm('ua.request');
  list.innerHTML=active.map(function(c){
    var sk=SHIFT_STATUSES[c.id]||'building';
    var so=STATUS_OPTS.find(function(o){return o.key===sk;})||STATUS_OPTS[0];
    var onPass=PASSES.some(function(p){return p.client_id===c.id&&p.status==='Out';});
    var choreLabel='';
    if(c.chore){var mc=MASTER_CHORES.find(function(m){return m.id===c.chore_id;});choreLabel=mc?mc.name:(c.chore||'');}
    return '<div class="res-card" onclick="'+(canEdit?'openStatusModal('+c.id+')':'')+'">'
      +'<div class="res-room">'+esc(c.room)+'</div>'
      +'<div class="res-info">'
        +'<div class="res-name">'+esc(c.name)+'</div>'
        +'<div class="res-detail">'+(c.case_manager?'CM: '+esc(c.case_manager):'')+(choreLabel?(c.case_manager?' · ':'')+'Chore: '+esc(choreLabel):'')+(onPass?(c.case_manager||choreLabel?' · ':'')+'<span style="color:#854d0e;">On Pass</span>':'')+'</div>'
      +'</div>'
      +'<div class="res-actions">'
        +'<span class="sb '+so.cls+'">'+so.label+'</span>'
        +(canUA?'<button class="ua-btn" onclick="event.stopPropagation();requestUA('+c.id+',\''+esc(c.name)+'\',\''+esc(c.room)+'\')" title="Request UA">🧪</button>':'')
      +'</div>'
    +'</div>';
  }).join('');
}

// ── Status modal ─────────────────────────────────────────
var _statusClientId=null;
function openStatusModal(clientId){
  _statusClientId=clientId;
  _editClientId=clientId;
  var c=CLIENTS.find(function(x){return x.id===clientId;});
  var title=document.getElementById('status-modal-title');
  if(title)title.textContent=(c?'Rm '+c.room+' — '+c.name:'Change Status');
  var cur=SHIFT_STATUSES[clientId]||'building';
  var grid=document.getElementById('status-grid');
  if(grid){
    grid.innerHTML=STATUS_OPTS.map(function(o){
      return '<button class="status-opt '+o.cls+(cur===o.key?' active-status':'')+'" onclick="setStatus(\''+o.key+'\')" style="border-color:'+(cur===o.key?'':'')+'">'+o.label+'</button>';
    }).join('');
  }
  var editBtn=document.querySelector('#ov-status .btn-secondary');
  if(editBtn)editBtn.style.display=hasPerm('residents.edit')?'':'none';
  openOverlay('ov-status');
}
async function setStatus(key){
  if(!_statusClientId||!CURRENT_RPT)return;
  SHIFT_STATUSES[_statusClientId]=key;
  renderRoster();
  closeOverlay('ov-status');
  var patch={reportId:CURRENT_RPT.id,statuses:{[_statusClientId]:key}};
  _ownPatch=patch;
  try{await fetch('/api/data',{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(patch)});}
  catch(e){showToast('Save failed','err');}
}

// ── Client edit ──────────────────────────────────────────
function openClientSheet(){
  closeOverlay('ov-status');
  var c=CLIENTS.find(function(x){return x.id===_editClientId;});
  if(!c)return;
  document.getElementById('client-modal-title').textContent='Edit — '+c.name;
  document.getElementById('ce-room').value=c.room||'';
  document.getElementById('ce-name').value=c.name||'';
  document.getElementById('ce-cm').value=c.case_manager||'';
  document.getElementById('ce-phone').value=c.phone||'';
  document.getElementById('ce-admit').value=c.intake_date||'';
  openOverlay('ov-client');
}
async function saveClient(){
  if(!_editClientId)return;
  var body={room:document.getElementById('ce-room').value.trim(),name:document.getElementById('ce-name').value.trim(),case_manager:document.getElementById('ce-cm').value.trim(),phone:document.getElementById('ce-phone').value.trim(),intake_date:document.getElementById('ce-admit').value||null};
  if(!body.name){showToast('Name required','err');return;}
  try{
    var r=await fetch('/api/clients/'+_editClientId,{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});
    if(r.ok){var c=CLIENTS.find(function(x){return x.id===_editClientId;});if(c)Object.assign(c,body);renderRoster();closeOverlay('ov-client');showToast('Resident updated');}
    else showToast('Save failed','err');
  }catch(e){showToast('Save failed','err');}
}

// ── UA request ───────────────────────────────────────────
async function requestUA(clientId,name,room){
  try{
    var r=await fetch('/api/ua-requests',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({client_id:clientId,client_name:name,room:room})});
    if(r.ok){showToast('🧪 UA request sent — Rm '+room);}
    else showToast('UA request failed','err');
  }catch(e){showToast('UA request failed','err');}
}

// ── Log ──────────────────────────────────────────────────
function renderLog(){
  var list=document.getElementById('log-list');
  if(!list)return;
  var canDel=hasPerm('log.delete');
  var entries=[].concat(LOG_ENTRIES).reverse();
  if(!entries.length){list.innerHTML='<div class="empty">No log entries yet.</div>';return;}
  list.innerHTML=entries.map(function(e){
    return '<div class="log-card">'
      +(canDel?'<button class="log-del" onclick="deleteLogEntry('+e.id+')" title="Delete">✕</button>':'')
      +'<div class="log-ts">'+esc(e.time||'')+'</div>'
      +'<div class="log-txt">'+esc(e.text||'')+'</div>'

function pickLogPhoto(){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    if(!inp.files[0])return;
    if(inp.files[0].size>5*1024*1024){showToast('Photo must be under 5MB','err');return;}
    var reader=new FileReader();
    reader.onload=function(ev){
      _logPhotoB64=ev.target.result;
      var prev=document.getElementById('le-photo-preview');
      var img=document.getElementById('le-photo-img');
      if(img)img.src=ev.target.result;
      if(prev)prev.style.display='block';

async function saveLogEntry(){
  if(!CURRENT_RPT){showToast('No active report','err');return;}
  var txt=document.getElementById('le-text').value.trim();
  var timeVal=document.getElementById('le-time').value;
  if(!txt){showToast('Entry text required','err');return;}
  // Convert 24h HH:MM to 12h format matching desktop convention
  var timeStr=timeVal;
  try{var p=timeVal.split(':'),h=parseInt(p[0]),m=parseInt(p[1]),ap=h>=12?'PM':'AM';h=h%12||12;timeStr=h+':'+(m<10?'0':'')+m+' '+ap;}catch(e){}
  try{
    var r=await fetch('/api/data',{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'include',
      body:JSON.stringify({reportId:CURRENT_RPT.id,log_entry:{time:timeStr,text:txt}})});
    if(!r.ok){showToast('Save failed','err');return;}
    closeOverlay('ov-log');
    // Reload to get the new entry with its DB-assigned id (needed for photo attachment)
    var photoB64=_logPhotoB64;_logPhotoB64=null;
    await loadAll();
    if(photoB64){
      // Find the newest entry with this text to attach the photo
      for(var i=LOG_ENTRIES.length-1;i>=0;i--){
        if(LOG_ENTRIES[i].text===txt&&LOG_ENTRIES[i].id){
          try{await fetch('/api/log/'+LOG_ENTRIES[i].id+'/photo',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({photo:photoB64})});}catch(e){}
          break;
        }
      }
      renderLog();
    }
    showToast('Entry saved');
  }catch(e){showToast('Save failed','err');}
}
async function deleteLogEntry(id){

    var r=await fetch('/api/log/'+id,{method:'DELETE',credentials:'include'});
    if(r.ok){LOG_ENTRIES=LOG_ENTRIES.filter(function(e){return e.id!==id;});renderLog();showToast('Entry deleted');}

// ── Report archive actions ─────────────────────────────────
function viewReport(id){
  var rpt=REPORTS.find(function(r){return r.id===id;});
  if(!rpt)return;
  CURRENT_RPT=rpt;
  SHIFT_STATUSES={};
  var ss=rpt.statuses;
  if(typeof ss==='string'){try{ss=JSON.parse(ss);}catch(e){ss={};}}
  Object.assign(SHIFT_STATUSES,ss||{});
  LOG_ENTRIES=rpt.log_entries||[];
  updateShiftBar();
  renderRoster();
  renderLog();
  renderMore();
  showToast('Viewing '+(rpt.report_date||rpt.date||'')+(rpt.shift?' · '+rpt.shift.replace(' Shift',''):''));
}
async function deleteReport(id){
  if(!hasPerm('reports.delete'))return;
  if(!confirm('Delete this report? This cannot be undone.'))return;
  try{
    var r=await fetch('/api/reports/'+id,{method:'DELETE',credentials:'include'});
    if(r.ok){
      REPORTS=REPORTS.filter(function(rpt){return rpt.id!==id;});
      if(CURRENT_RPT&&CURRENT_RPT.id===id){
        CURRENT_RPT=REPORTS.length?REPORTS[REPORTS.length-1]:null;
        SHIFT_STATUSES={};
        LOG_ENTRIES=[];
        if(CURRENT_RPT){
          var ss=CURRENT_RPT.statuses;
          if(typeof ss==='string'){try{ss=JSON.parse(ss);}catch(e){ss={};}}
          Object.assign(SHIFT_STATUSES,ss||{});
          LOG_ENTRIES=CURRENT_RPT.log_entries||[];
        }
        updateShiftBar();renderRoster();renderLog();
      }
      renderMore();showToast('Report deleted');
    }else showToast('Delete failed','err');
  }catch(e){showToast('Delete failed','err');}
}

  var sel=document.getElementById('ml-client');
  if(!sel||!sel.value){showToast('Select a resident','err');return;}
  var parts=sel.value.split('|');
  var body={client_id:parseInt(parts[0]),client_name:parts[1]||'',room:parts[2]||'',notes:document.getElementById('ml-notes').value.trim(),logged_by:window.SESSION?window.SESSION.displayName||window.SESSION.username:'Staff'};
  try{
    var r=await fetch('/api/mail',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});
    if(r.ok){var d=await r.json();if(d.entry)MAIL_LOG.unshift(d.entry);closeOverlay('ov-mail');renderMore();showToast('Mail logged');}
    else showToast('Save failed','err');
  }catch(e){showToast('Save failed','err');}
}

// ── UA banner ─────────────────────────────────────────────
function checkUABanner(){
  if(!hasPerm('ua.acknowledge'))return;
  var pending=(UA_REQUESTS||[]).filter(function(r){return !r.acknowledged;});
  var banner=document.getElementById('ua-banner');
  var msg=document.getElementById('ua-banner-msg');
  if(!banner)return;
  if(pending.length){
    if(msg)msg.textContent='🧪 '+pending.length+' UA Request'+(pending.length!==1?'s':'')+' pending';
    banner.classList.add('active');
  }else{
    banner.classList.remove('active');
  }
}
async function acknowledgeAllUA(){
  var pending=(UA_REQUESTS||[]).filter(function(r){return !r.acknowledged;});
  if(!pending.length){showToast('No pending UAs');return;}
  for(var i=0;i<pending.length;i++){
    try{await fetch('/api/ua-requests/'+pending[i].id+'/acknowledge',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include'});}catch(e){}
    pending[i].acknowledged=1;
  }
  checkUABanner();
  renderMore();
  showToast('All UAs acknowledged');
}

// ── Reminders ─────────────────────────────────────────────
var _remFiredKeys={}, _remTimer=null;
function parseSchedMin(t){
  var m=t&&t.match(/(\d+):(\d+)\s*(AM|PM)/i);if(!m)return -1;
  var h=parseInt(m[1]),mn=parseInt(m[2]),ap=m[3].toUpperCase();
  if(ap==='PM'&&h!==12)h+=12;if(ap==='AM'&&h===12)h=0;
  return h*60+mn;
}
function checkReminders(){
  if(!hasPerm('reminders.view')){document.getElementById('rem-bar')&&document.getElementById('rem-bar').classList.remove('active');return;}
  if(!CURRENT_RPT){return;}
  var now=new Date(),nowMins=now.getHours()*60+now.getMinutes(),today=now.toDateString();
  var wellnessDue=false,walkDue=false;
  function schedFired(sched,pfx){
    if(!sched||!sched.length)return false;
    var hit=false;
    sched.forEach(function(t){var sm=parseSchedMin(t);if(sm<0)return;var k=pfx+':'+sm;if(_remFiredKeys[k]===today)return;if(nowMins>=sm&&nowMins<=sm+2){_remFiredKeys[k]=today;hit=true;}});
    return hit;
  }
  if(WELLNESS_INTERVAL>0){
    var lastW=null;
    LOG_ENTRIES.forEach(function(e){if(e.text&&e.text.toLowerCase().includes('wellness check')){var d=new Date((CURRENT_RPT.report_date||CURRENT_RPT.date||new Date().toISOString().slice(0,10))+'T'+(e.time||'00:00'));if(!lastW||d>lastW)lastW=d;}});
    if(!lastW||(now-lastW)>WELLNESS_INTERVAL*60000)wellnessDue=true;
  }
  if(WALK_INTERVAL>0){
    var lastWk=null;
    LOG_ENTRIES.forEach(function(e){if(e.text&&e.text.toLowerCase().includes('walkthrough')){var d=new Date((CURRENT_RPT.report_date||CURRENT_RPT.date||new Date().toISOString().slice(0,10))+'T'+(e.time||'00:00'));if(!lastWk||d>lastWk)lastWk=d;}});
    if(!lastWk||(now-lastWk)>WALK_INTERVAL*60000)walkDue=true;
  }
  if(schedFired(WELLNESS_SCHEDULE,'w'))wellnessDue=true;
  if(schedFired(WALK_SCHEDULE,'wk'))walkDue=true;
  var bar=document.getElementById('rem-bar'),msg=document.getElementById('rem-msg');
  if((wellnessDue||walkDue)&&!_remDismissed){
    var parts=[];
    if(wellnessDue)parts.push('⚠ Wellness Check due');
    if(walkDue)parts.push('🚶 Walkthrough due');
    if(msg)msg.textContent=parts.join('  ·  ');
    bar&&bar.classList.add('active');
  }else{
    bar&&bar.classList.remove('active');
  }
}
function dismissReminder(){
  _remDismissed=true;
  document.getElementById('rem-bar')&&document.getElementById('rem-bar').classList.remove('active');
  setTimeout(function(){_remDismissed=false;},10*60*1000);
}
function startReminderEngine(){
  if(_remTimer)clearInterval(_remTimer);
  checkReminders();
  _remTimer=setInterval(checkReminders,30000);
}

// ── Overlay helpers ───────────────────────────────────────
function openOverlay(id){document.getElementById(id)&&document.getElementById(id).classList.add('open');}
function closeOverlay(id,e){if(e&&e.target!==document.getElementById(id))return;document.getElementById(id)&&document.getElementById(id).classList.remove('open');}

// ── Session info ──────────────────────────────────────────
(function(){
  if(!window.SESSION)return;
  var el=document.getElementById('hdr-user');
  if(el)el.textContent=(window.SESSION.displayName||window.SESSION.username)+' · '+(window.SESSION.role||'');
})();

// ── Init ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',function(){
  connectWS();
  loadAll();
  startReminderEngine();
  // Show FAB for log tab by default if permitted
  if(hasPerm('log.add')){var fab=document.getElementById('fab');if(fab)fab.style.display='flex';}
});
</script>
