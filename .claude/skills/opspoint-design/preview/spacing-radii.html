<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--card-bg); padding: 22px 24px; color: var(--ink-900); }
  .row { display: flex; gap: 14px; align-items: flex-end; }
  .item { text-align: center; }
  .box { background: var(--teal-50); border: 1.5px solid var(--teal-300); }
  .lab { font-size: 11px; font-weight: 700; margin-top: 8px; }
  .val { font-size: 10px; font-family: var(--font-mono); color: var(--ink-400); }
  .cap { margin-top: 16px; display: flex; align-items: baseline; gap: 10px; }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="width:60px;height:60px;border-radius:var(--r-xs)"></div><div class="lab">xs</div><div class="val">5px</div></div>
    <div class="item"><div class="box" style="width:60px;height:60px;border-radius:var(--r-sm)"></div><div class="lab">sm</div><div class="val">6px</div></div>
    <div class="item"><div class="box" style="width:60px;height:60px;border-radius:var(--r-md)"></div><div class="lab">md</div><div class="val">8px</div></div>
    <div class="item"><div class="box" style="width:60px;height:60px;border-radius:var(--r-lg)"></div><div class="lab">lg</div><div class="val">12px</div></div>
    <div class="item"><div class="box" style="width:60px;height:60px;border-radius:var(--r-xl)"></div><div class="lab">xl</div><div class="val">16px</div></div>
    <div class="item"><div class="box" style="width:60px;height:32px;border-radius:var(--r-pill)"></div><div class="lab">pill</div><div class="val">999px</div></div>
  </div>
  <div class="cap"><b>Corner radii</b><span>Controls &amp; cells at 5–8px; cards &amp; modals at 12–16px; status selects, badges &amp; pills fully rounded.</span></div>
</body>
</html>
