<!DOCTYPE html>
<html>
<head>
<title>ShiftPoint Icon Preview</title>
<style>
  body {
    background: #1a1a2e;
    display: flex;
    gap: 48px;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    flex-wrap: wrap;
  }
  .wrap { text-align: center; }
  .label { color: #888; font-family: sans-serif; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>

<!-- 192x192 -->
<div class="wrap">
<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e3b"/>
      <stop offset="100%" stop-color="#0d3d26"/>
    </linearGradient>
  </defs>
  <!-- Background — full square, let the OS apply corner rounding -->
  <rect width="192" height="192" fill="url(#bg1)"/>
  <!-- Top highlight -->
  <rect x="0" y="0" width="192" height="96" fill="white" fill-opacity="0.06"/>
  <!-- Circular shift arrow — large arc -->
  <path d="M 96 40 A 56 56 0 1 1 44 122" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <!-- Top arrowhead -->
  <polygon points="96,24 78,50 114,50" fill="white"/>
  <!-- Bottom arrowhead -->
  <polygon points="44,122 28,102 58,106" fill="white"/>
  <!-- Center diamond (the "Point") -->
  <polygon points="96,76 109,96 96,116 83,96" fill="#f0c040"/>
</svg>
<div class="label">192×192</div>
</div>

<!-- 64x64 -->
<div class="wrap">
<svg width="64" height="64" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e3b"/>
      <stop offset="100%" stop-color="#0d3d26"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" fill="url(#bg2)"/>
  <rect x="0" y="0" width="192" height="96" fill="white" fill-opacity="0.06"/>
  <path d="M 96 40 A 56 56 0 1 1 44 122" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <polygon points="96,24 78,50 114,50" fill="white"/>
  <polygon points="44,122 28,102 58,106" fill="white"/>
  <polygon points="96,76 109,96 96,116 83,96" fill="#f0c040"/>
</svg>
<div class="label">64×64</div>
</div>

<!-- 48x48 -->
<div class="wrap">
<svg width="48" height="48" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e3b"/>
      <stop offset="100%" stop-color="#0d3d26"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" fill="url(#bg3)"/>
  <rect x="0" y="0" width="192" height="96" fill="white" fill-opacity="0.06"/>
  <path d="M 96 40 A 56 56 0 1 1 44 122" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <polygon points="96,24 78,50 114,50" fill="white"/>
  <polygon points="44,122 28,102 58,106" fill="white"/>
  <polygon points="96,76 109,96 96,116 83,96" fill="#f0c040"/>
</svg>
<div class="label">48×48</div>
</div>

</body>
</html>
