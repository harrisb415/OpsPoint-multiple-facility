<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--card-bg); padding: 22px; color: var(--ink-900); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sig { border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--line); }
  .sig .top { height: 44px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 12px; }
  .sig .bot { padding: 8px 10px; display: flex; align-items: center; gap: 7px; }
  .sig .bot .dot { width: 9px; height: 9px; border-radius: 50%; }
  .sig .bot .t { font-size: 11px; font-weight: 600; }
  .sig .bot .h { font-size: 9px; font-family: var(--font-mono); color: var(--ink-400); margin-left: auto; }
  .cap { margin-top: 14px; display: flex; align-items: baseline; gap: 10px; }
  .cap b { font-size: 13px; font-weight: 700; }
  .cap span { font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="grid">
    <div class="sig"><div class="top" style="background:var(--success)">Success</div><div class="bot" style="background:var(--success-bg)"><span class="dot" style="background:var(--success)"></span><span class="t" style="color:var(--success)">Accounted for</span><span class="h">#15a34a</span></div></div>
    <div class="sig"><div class="top" style="background:var(--info)">Info</div><div class="bot" style="background:var(--info-bg)"><span class="dot" style="background:var(--info)"></span><span class="t" style="color:var(--info)">Logged</span><span class="h">#1d70d6</span></div></div>
    <div class="sig"><div class="top" style="background:var(--warning)">Warning</div><div class="bot" style="background:var(--warning-bg)"><span class="dot" style="background:var(--warning)"></span><span class="t" style="color:var(--warning)">Due soon</span><span class="h">#d97706</span></div></div>
    <div class="sig"><div class="top" style="background:var(--danger)">Danger</div><div class="bot" style="background:var(--danger-bg)"><span class="dot" style="background:var(--danger)"></span><span class="t" style="color:var(--danger)">Overdue</span><span class="h">#d62828</span></div></div>
  </div>
  <div class="cap"><b>Semantic Signals</b><span>Save states, reminders, validation. Each pairs a solid fill with a soft tinted background + border for inline banners.</span></div>
</body>
</html>
